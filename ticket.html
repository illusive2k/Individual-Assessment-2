<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Conf 2026 - Register</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <div class="image1"></div>
    </header>

    <main>
        <div class="conf-banner2">
            <div class="title-wrap">
                <h1 >Congratulations! Your ticket is ready.</h1>

            <h2> Your registration for Coding Conf 2026 is complete!</h2>
                <div class="rectangle1">
                    <div class="ticket-header">
                        <h3>Ticket Details</h3>
                        <span id="ticket-serial" class="serial-badge">Serial: 0000000</span>
                    </div>

                    <div class="ticket-body">
                        <img id="ticket-avatar" src="" alt="Attendee Profile Picture" class="avatar-img">
                        
                        <div class="ticket-details">
                            <h3 id="ticket-name">Attendee Name</h3>
                            <p class="detail-item">
                                <span class="label">Email:</span>
                                <span id="ticket-email">john.doe@example.com</span>
                            </p>
                            <p class="detail-item">
                                <span class="label">GitHub:</span>
                                <span id="ticket-github">@johndoe</span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div style="margin-top: 25px;">
                <a href="index.html" class="btn"> Back to Home</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Coding Conf. All rights reserved.</p>
    </footer>
<script src="../js/ticket.js"></script>
</body>
</html>
