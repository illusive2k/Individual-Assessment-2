<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Conf 2026 - Register</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
        <div class="image1"></div>
    </header>

    <main>
        <div class="conf-banner2">
            <div class="title-wrap">
                <h1>Your Journey to Coding Conf 2026</h1>
                <h2>Starts Here!!</h2>
                <h4>Register now to secure a spot at the coding conference of the year.</h4>
                
                <div class="form-container">
                    
                   <form id="registration-form">

                        <div class="form-group">
                            <label for="avatar">Avatar Graphic Upload (JPEG/PNG, max 500KB):</label>
                            <input type="file" id="avatar" name="avatar" accept="image/jpeg, image/png" required>
                        </div>

                        <div class="form-group">
                            <label for="fname">First Name:</label>
                            <input type="text" id="fname" name="fname" placeholder="John" required>
                        </div>

                        <div class="form-group">
                            <label for="lname">Last Name:</label>
                            <input type="text" id="lname" name="lname" placeholder="Doe" required>
                        </div>

                        <div class="form-group">
                            <label for="emailL">Email:</label>
                            <input type="email" id="emailL" name="email" placeholder="placeholder@example.com" required>
                        </div>

                        <div class="form-group">
                            <label for="Git">GitHub User Tag:</label>
                            <input type="text" id="Git" name="github" placeholder="@SlushyOcean2417" required>
                        </div>

                        
                        <button type="submit" class="btn">Submit</button>

                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Coding Conf. All rights reserved.</p>
    </footer>
<script src="../js/ticket.js"></script>
<script src="../js/validation.js"></script>
</body>
</html>
